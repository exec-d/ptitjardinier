# Valide chaque fiche plante contre le schéma dès qu'une fiche ou le schéma
# lui-même changent. Le pari du projet (sept ancres suffisent) ne vaut que
# si personne ne peut faire passer une fiche fautive ou un vocabulaire élargi
# sans que ce garde-fou ne le voie.
#
# Vérifie aussi que plants/index.json et manifest.json — l'index léger et le
# manifeste que l'application télécharge sans les fiches complètes — sont
# bien ce que produirait tools/construire_index.py à partir des fiches
# commitées. Un index périmé est pire qu'absent : il fait disparaître
# silencieusement des fiches de la recherche, sans qu'aucune erreur ne le
# signale ailleurs.
#
# Les déclencheurs couvrent donc aussi tools/valider.py et
# tools/construire_index.py, pas seulement plants/** et schema/** : une
# modification qui ne touche que le générateur (un bump de format_version,
# un champ ajouté à l'index) ou que le validateur ne doit pas pouvoir passer
# sans que ce garde-fou tourne — ce serait le même silence que celui qu'il
# existe pour attraper, déplacé sur une autre surface d'édition.
# manifest.json est listé explicitement pour la même raison ;
# plants/index.json n'a pas besoin de l'être, déjà couvert par "plants/**".
#
# workflow_dispatch : GitHub n'évalue pas un filtre paths sur le push qui
# crée une branche (il n'a aucune base de comparaison pour dire quels
# chemins ont changé) — le push initial de ce dépôt sur GitHub n'a donc
# jamais déclenché ce workflow, alors qu'il touchait plants/**,
# manifest.json et les deux outils. Sans un déclenchement manuel, ce
# garde-fou serait resté invérifié jusqu'au prochain push normal, et
# resterait de toute façon inatteignable après un incident ou une panne de
# runner. Même motif que backfill.yml, daily.yml et validate.yml chez
# exec-d/plusdsaison, qui ont tous ce déclencheur.
name: Valider les fiches

on:
  push:
    paths:
      - "plants/**"
      - "schema/**"
      - "tools/valider.py"
      - "tools/construire_index.py"
      - "manifest.json"
  pull_request:
    paths:
      - "plants/**"
      - "schema/**"
      - "tools/valider.py"
      - "tools/construire_index.py"
      - "manifest.json"
  workflow_dispatch:

jobs:
  valider:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 (historique complet) : tools/construire_index.py
      # dérive manifest.json d'un `git log -- plants/`, qui a besoin de tout
      # l'historique. Le défaut d'actions/checkout (fetch-depth: 1) ne
      # récupère que le dernier commit et rendrait cette date fausse ou
      # indisponible.
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: python -m pip install -r tools/requirements.txt

      - name: Valider les fiches
        run: python tools/valider.py

      - name: Régénérer l'index et le manifeste
        run: python tools/construire_index.py

      - name: Vérifier que l'index et le manifeste commités sont à jour
        run: |
          if ! git diff --exit-code -- plants/index.json manifest.json; then
            echo "::error::plants/index.json ou manifest.json commité ne correspond plus aux fiches. Relancer 'python tools/construire_index.py' localement et commiter le résultat."
            exit 1
          fi
